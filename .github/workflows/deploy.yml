name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write 

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Install autoprefixer
      run: npm install --legacy-peer-deps autoprefixer

    - name: Set environment variables
      run: |
        echo "NODE_ENV=production" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV

    - name: Build project
      run: npm run build
      env:
        NODE_ENV: production
        GITHUB_ACTIONS: true

    - name: Debug output directory
      run: |
        echo "Contents of ./out directory:"
        find ./out -type f | sort
        echo "Contents of ./out/_next directory:"
        find ./out/_next -type f -name "*.css" | sort || echo "No CSS files found"
        echo "Contents of CSS files:"
        find ./out/_next -type f -name "*.css" -exec cat {} \; || echo "No CSS files found"
        echo "Checking asset references in HTML:"
        grep -r "/_next/" ./out/*.html || echo "No asset references found"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} 
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
